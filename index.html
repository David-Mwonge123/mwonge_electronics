<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MWONGE ELECTRONICS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- NAV - Flex layout -->
    <nav class="glass nav">
      <div class="logo">MWONGE <span>.</span></div>
      <div class="nav-links">
        <a href="#grid">PRODUCTS</a>
        <a href="#cart">CART</a>
      </div>
    </nav>
    <!-- HEADER SECTION -->
    <header class="header">
      <h1>Essential<br />Tech</h1>
      <p class="glass">
        Welcome to Mwonge Electronics where all your gadget problems are solved
        <i>swiftly!</i> with the click of a button.
      </p>
    </header>

    <!-- PRODUCT GRID - CSS GRID -->
    <main id="grid">
      <!-- PRODUCT 1 -->
      <a href="#m1" class="card glass">
        <div class="img-wrap">
          <img src="images/headphones.jpg" alt="Headphones" width="250px" />
        </div>
        <h2>Studio Pro Headphones</h2>
        <div class="price">20,000KSH</div>
        <div class="rating">
          &#9733;&#9733;&#9733;&#9733;&#9733;&#9733; 4.9 (350)
        </div>
        <button>Add to Cart</button>
      </a>
      <!-- PRODUCT 2 -->
      <a href="#m2" class="card glass">
        <div class="img-wrap">
          <img src="images/watch.jpg" alt="Digital watch" />
        </div>
        <h2>Digital Watch Series</h2>
        <div class="price">15,000KSH</div>
        <div class="rating">&#9733;&#9733;&#9733;&#9733;&#9734; 4.7 (180)</div>
        <button>Add to Cart</button>
      </a>
    </main>
  </body>
</html>
